name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "::warning::KEYSTORE_PASSWORD belum diisi, APK ditandatangani dengan kunci uji coba"; fi
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../SwaraLudo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SwaraLudo-apk
          path: SwaraLudo.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: SWARA LUDO APK ${{ github.run_number }}
          files: SwaraLudo.apk
          make_latest: true
